name: Refresh data

# Weekly refresh of the card pool and the Forbidden & Limited list.
# Never runs at request time — the app only ever reads the committed JSON.
on:
  schedule:
    # Mondays 04:15 UTC.
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the scraper
        run: npx playwright install --with-deps chromium

      # Logs the card count and diffs it against the previous run, so an upstream
      # change to YGOPRODeck's approximate Duel Links flag is visible in the PR.
      - name: Fetch card pool
        id: cards
        run: npm run fetch:cards

      # Fails closed: an empty tier, a count that disagrees with the page's own
      # declared count, or a shift over 25% aborts without touching the committed
      # file. A bad scrape must never silently produce an empty banlist.
      - name: Scrape banlist
        id: banlist
        run: npm run scrape:banlist

      # Must run AFTER fetch:cards: every card name in a derived template is
      # resolved against data/cards.json, and the run aborts below a 95% join
      # rate. Against a stale pool that gate fires on cards that are simply too
      # new, so a fresh pool is a precondition, not a coincidence of ordering.
      - name: Derive deck templates
        id: decks
        run: npm run fetch:decks

      # The suite re-checks every authored template against the freshly scraped
      # list: if Konami moved a card into a tier that makes a template illegal,
      # this fails and no PR is opened.
      - name: Verify against the new data
        run: npm test

      - name: Push the refreshed data for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          branch="data-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "chore(data): weekly card pool, banlist and deck template refresh"
          git push -u origin "$branch"

          body="Automated weekly refresh. Counts and the added/removed diff are in the [job summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Merge only if the diff looks like a real upstream change."

          # Opening a PR from a workflow needs "Allow GitHub Actions to create
          # and approve pull requests" at BOTH org and repo level. The
          # Sing-Jee-Tao org currently disallows it, so fall back to an issue
          # carrying the compare link rather than failing a refresh whose real
          # work — fetch, scrape, validate, push — already succeeded.
          if gh pr create \
              --title "chore(data): weekly card pool, banlist and deck template refresh" \
              --body "$body" \
              --base main --head "$branch"; then
            echo "Pull request opened."
          else
            echo "PR creation is not permitted; opening an issue with the compare link instead."
            gh issue create \
              --title "Data refresh ready for review: $branch" \
              --body "$body

          Actions cannot open pull requests in this org, so the refreshed data is waiting on \`$branch\`:

          ${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
          fi

      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Data refresh failed on $(date -u +%Y-%m-%d)" \
            --body "The weekly refresh job failed. \`data/banlist.json\`, \`data/cards.json\`, \`data/decks.json\` and \`data/synergy.json\` were left untouched, so the site is still serving the last known good data.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Likely causes:
          - duellinksmeta.com redesigned, breaking the parser (the golden-file tests in \`scripts/parse-banlist.test.ts\` and \`scripts/derive-templates.test.ts\` will say so)
          - a tier came back empty, or the list shifted by more than 25%
          - the template count drifted more than 25%, or card names stopped resolving against the pool
          - YGOPRODeck was unreachable

          If Konami has announced a change that the scrape cannot see yet, apply it by hand in \`data/banlist-override.json\`." \
            --label "data"
