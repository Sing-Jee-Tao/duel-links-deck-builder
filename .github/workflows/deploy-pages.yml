name: Deploy to GitHub Pages

# Alternative to the Netlify deploy, and OFF by default: this repo is private,
# where Pages needs a paid org plan, so running it on every push would fail the
# build on main for a deploy target nobody has enabled.
#
# To use it: Settings → Pages → Source: GitHub Actions, then either run this
# workflow manually or add the `push` trigger back. It serves at
# https://<org>.github.io/<repo>/ — the build uses a relative base, so it works
# from a subpath without further configuration.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
