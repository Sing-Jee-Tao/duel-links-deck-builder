name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the golden-file test for the banlist parser and the integration
      # tests over the committed data/ — an authored template that references a
      # card outside the pool, or a deck that cannot be built legally under the
      # current banlist, fails here.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
